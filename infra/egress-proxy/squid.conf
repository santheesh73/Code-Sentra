# Egress allowlist for the dependency download (ADR 0030). The download container has no
# route to the internet except this proxy; the proxy forwards HTTPS CONNECT only to the
# registries in allowed-hosts.txt, on port 443, and denies everything else. It never
# intercepts TLS: the tunnel stays end to end, so no registry credential is visible here.
visible_hostname codesentra-egress
pid_filename /tmp/squid.pid
cache deny all
access_log stdio:/tmp/egress-access.log
cache_log /tmp/egress-cache.log
http_port 3128

acl registries dstdomain "/etc/squid/allowed-hosts.txt"
acl ssl_port port 443
acl CONNECT method CONNECT

# CONNECT to an allowed registry on 443 only; plain HTTP and every other host are denied.
http_access deny CONNECT !ssl_port
http_access allow CONNECT registries
http_access deny all
