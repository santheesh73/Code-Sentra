# worker-scan on a dedicated VM (Section 8.4: untrusted code runs only in the sandbox).
# The VM runs Docker with the gVisor runtime (runsc); this compose file runs the worker,
# which starts sandbox containers through the host's Docker socket. Nothing else runs on
# this VM. See docs/runbook.md "worker-scan VM".
#
#   docker compose --env-file /etc/codesentra/worker-scan.env -f worker-scan.compose.yml up -d
services:
  worker-scan:
    image: ${WORKER_SCAN_IMAGE:?set WORKER_SCAN_IMAGE to the pushed codesentra/worker-scan tag}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Snapshot scratch copies live here; the same path is bind-mounted below so the
      # host's Docker daemon can mount them into sandbox containers.
      TMPDIR: /var/lib/codesentra/scratch
      DATABASE_URL: ${DATABASE_URL:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      SANDBOX_RUNTIME: runsc
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:?set SANDBOX_IMAGE to the pushed codesentra/sandbox tag}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:?}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:?}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:?}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and outside (see TMPDIR above).
      - /var/lib/codesentra/scratch:/var/lib/codesentra/scratch
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID to the gid of /var/run/docker.sock}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
