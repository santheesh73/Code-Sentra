name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # Unit + integration tests and the Phase 0 fixture gate (harness + real-browser fixture self-test).
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the fixture self-test
        run: pnpm --filter @codesentra/fixture-harness exec playwright-core install --with-deps chromium
      - run: pnpm build
      # Scan probes run in this image (runc on the runner: there is no gVisor; ADR 0016).
      - name: Build the sandbox image and pull gitleaks
        run: |
          docker build -t codesentra/sandbox:ci infra/sandbox
          docker pull zricethezav/gitleaks:v8.30.1
      # Integration tests start Postgres/MinIO with Testcontainers (Docker is available on the runner).
      - run: pnpm test
        env:
          SANDBOX_IMAGE: codesentra/sandbox:ci
      - name: OpenAPI docs are up to date
        run: pnpm openapi && git diff --exit-code docs/openapi.json docs/api.md

  # Phase 1–4 gates: real Postgres + MinIO (Testcontainers), API, worker-pulse (real
  # Chromium), worker-scan (sandbox, gitleaks, offline OSV), worker-link, web and the fixture harness on
  # loopback, driven in Chromium.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @codesentra/e2e exec playwright install --with-deps chromium
      # Everything e2e depends on, including the fixture harness and the fixture app exports.
      - run: pnpm turbo run build --filter=@codesentra/e2e...
      - name: Build the sandbox image and pull gitleaks
        run: |
          docker build -t codesentra/sandbox:ci infra/sandbox
          docker pull zricethezav/gitleaks:v8.30.1
      - run: pnpm e2e
        env:
          SANDBOX_IMAGE: codesentra/sandbox:ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Write throwaway .env
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "S3_BUCKET=codesentra"
            echo "S3_ACCESS_KEY_ID=ci-$(openssl rand -hex 4)"
            echo "S3_SECRET_ACCESS_KEY=$(openssl rand -hex 20)"
          } > .env
      # Wait only on long-running services: `up --wait` exits 1 when the one-shot minio-init finishes.
      - run: docker compose --env-file .env -f infra/docker-compose.yml --profile fixtures up -d --build --wait postgres minio fixture-harness
      - name: Create bucket
        run: docker compose --env-file .env -f infra/docker-compose.yml run --rm minio-init
      - name: Smoke-test the harness
        run: curl -fsS http://localhost:4100/ -o /dev/null
      - if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml --profile fixtures down -v

  # Production images (Section 17: container image scanning). Each image is built, smoke
  # tested, and scanned with Trivy: a CRITICAL vulnerability that has a fix fails the job;
  # HIGH ones are listed for review (docs/security.md).
  images:
    runs-on: ubuntu-24.04
    env:
      TRIVY: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          docker build -f infra/node/Dockerfile --build-arg SERVICE=api -t codesentra/api:ci .
          docker build -f infra/node/Dockerfile --build-arg SERVICE=worker-link -t codesentra/worker-link:ci .
          docker build -f infra/scan/Dockerfile -t codesentra/worker-scan:ci .
          docker build -f infra/pulse/Dockerfile -t codesentra/worker-pulse:ci .
      - name: Chromium launches in the Pulse image
        run: >-
          docker run --rm codesentra/worker-pulse:ci node -e
          "import('@codesentra/checks').then(async (m) => { const r = await m.launchPulseBrowser();
          if (!r.browser) { console.error(r.reason); process.exit(1); }
          console.log('chromium', r.browser.version()); await r.browser.close(); })"
      - name: The scan image has git and the Docker CLI, as a non-root user
        run: |
          docker run --rm --entrypoint sh codesentra/worker-scan:ci -c 'git --version && docker --version && test "$(id -u)" != 0'
      - name: API migrates and answers /health
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=cs postgres:16.15-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          ENVS="-e NODE_ENV=development -e DATABASE_URL=postgres://postgres:pw@pg:5432/cs -e SESSION_SECRET=$(openssl rand -hex 32) -e ENCRYPTION_KEY=$(openssl rand -base64 32) -e PUBLIC_APP_URL=https://app.example.test -e API_HOST=0.0.0.0"
          docker run --rm --network smoke $ENVS --entrypoint node codesentra/api:ci node_modules/@codesentra/db/dist/migrate-cli.js
          docker run -d --name api --network smoke $ENVS -p 4000:4000 codesentra/api:ci
          docker run -d --name wl --network smoke $ENVS codesentra/worker-link:ci
          for i in $(seq 1 30); do curl -fsS localhost:4000/health && break; sleep 1; done
          curl -fsS localhost:4000/health | grep -q '"status":"ok"'
          sleep 3 && docker logs wl 2>&1 | grep -q "worker-link ready"
      - name: Scan images (Trivy)
        run: |
          for img in api worker-link worker-scan worker-pulse; do
            echo "::group::codesentra/$img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --no-progress codesentra/$img:ci
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
              --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet codesentra/$img:ci
            echo "::endgroup::"
          done

  # Dependency scanning (Section 17): known high/critical advisories in production
  # dependencies fail the build. Accepted exceptions live in pnpm-workspace.yaml with a reason.
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 git . --config .gitleaks.toml --no-banner --redact
