# Local development infrastructure.
#
#   pnpm infra:up          # postgres + minio, then `run --rm minio-init` for the bucket
#   pnpm infra:fixtures    # also the fixture harness on localhost:4100+
#
# Reads ../.env (copy ../.env.example). All ports bind to 127.0.0.1 only.
# Behind a TLS-intercepting proxy, prebuild the harness image with the optional
# `extra_ca` secret (see docs/architecture.md), then run without --build.
#
#   pnpm stack:up          # the whole app in containers (profile "app"): migrate, api,
#                          # worker-link, worker-pulse, worker-scan, web on localhost:3000
#
# Without the profile it is infrastructure only, for `pnpm start:*` development.
name: codesentra

# The app services' shared configuration: ../.env plus container addresses.
x-app-env: &app-env
  NODE_ENV: development
  LOG_LEVEL: info
  DATABASE_URL: postgres://codesentra:${POSTGRES_PASSWORD}@postgres:5432/codesentra
  S3_ENDPOINT: http://minio:9000
  # Browsers upload zips straight to MinIO (ADR 0024): the address they reach.
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  PUBLIC_APP_URL: http://localhost:3000
  EMAIL_TRANSPORT: outbox
  EMAIL_OUTBOX_DIR: /outbox

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: codesentra
      POSTGRES_DB: codesentra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesentra -d codesentra"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Community build of MinIO from source (ADR 0004): upstream stopped publishing images.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"
    restart: "no"

  fixture-harness:
    profiles: ["fixtures"]
    build:
      context: ..
      dockerfile: fixtures/harness/Dockerfile
    environment:
      HARNESS_HOST: 0.0.0.0
      HARNESS_PUBLIC_HOST: localhost
      HARNESS_BASE_PORT: "4100"
    ports:
      - "127.0.0.1:4100-4130:4100-4130"

  # --- The app (profile "app") -----------------------------------------------------

  migrate:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/node/Dockerfile, args: { SERVICE: api } }
    image: codesentra/api:local
    env_file: [../.env]
    environment: *app-env
    entrypoint: ["node", "node_modules/@codesentra/db/dist/migrate-cli.js"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    profiles: ["app"]
    image: codesentra/api:local
    env_file: [../.env]
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: "4000"
    ports: ["127.0.0.1:4000:4000"]
    volumes: [outbox:/outbox]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  worker-link:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/node/Dockerfile, args: { SERVICE: worker-link } }
    image: codesentra/worker-link:local
    env_file: [../.env]
    environment: *app-env
    volumes: [outbox:/outbox]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker-pulse:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/pulse/Dockerfile }
    image: codesentra/worker-pulse:local
    env_file: [../.env]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  # The probe image worker-scan starts sandboxes from (built, never run here).
  sandbox-image:
    profiles: ["app"]
    build: { context: ../infra/sandbox }
    image: codesentra/sandbox:local
    entrypoint: ["true"]
    restart: "no"

  # Runs untrusted code only inside sandboxes on the host's Docker (runc locally; use the
  # gVisor VM setup in infra/deploy/ for anything but your own machine).
  worker-scan:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/scan/Dockerfile }
    image: codesentra/worker-scan:local
    env_file: [../.env]
    environment:
      <<: *app-env
      SANDBOX_RUNTIME: runc
      SANDBOX_IMAGE: codesentra/sandbox:local
      # Sandboxes mount snapshot copies by path through the host's Docker, so the scratch
      # directory has the same path inside and outside this container.
      TMPDIR: /tmp/codesentra-scratch
    # The group that owns the Docker socket on your machine (stat -c %g /var/run/docker.sock).
    user: "node:${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/codesentra-scratch:/tmp/codesentra-scratch
    depends_on:
      migrate: { condition: service_completed_successfully }
      sandbox-image: { condition: service_completed_successfully }
      scratch-init: { condition: service_completed_successfully }

  scratch-init:
    profiles: ["app"]
    image: node:22.23.4-bookworm-slim
    entrypoint: ["sh", "-c", "chmod 1777 /tmp/codesentra-scratch"]
    volumes: ["/tmp/codesentra-scratch:/tmp/codesentra-scratch"]
    restart: "no"

  web:
    profiles: ["app"]
    build: { context: .., dockerfile: infra/web/Dockerfile }
    image: codesentra/web:local
    environment:
      PUBLIC_APP_URL: http://localhost:3000
      API_INTERNAL_URL: http://api:4000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  minio-data:
  outbox:
